spring:
  application:
    name: traffic-api
  datasource:
    url: jdbc:snowflake://${SNOWFLAKE_ACCOUNT}.snowflakecomputing.com/?db=TRAFFIC_INTELLIGENCE_DB&schema=DBT_DEV_GOLD&warehouse=COMPUTE_WH&JDBC_QUERY_RESULT_FORMAT=JSON
    username: ${SNOWFLAKE_USER}
    password: ${SNOWFLAKE_PASSWORD}
    driver-class-name: net.snowflake.client.jdbc.SnowflakeDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui

debug: true